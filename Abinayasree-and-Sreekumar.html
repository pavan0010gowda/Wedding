:root{--wine:#4c1927;--wine-deep:#2f0f19;--gold:#b89759;--gold-light:#e1c58c;--paper:#f6f0e3;--ink:#4a292b;--muted:#837366;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:75px}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}button{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:6px}button:disabled{cursor:default}h1,h2,h3,p{margin:0}h2,h3{font-family:var(--serif);font-weight:400}h2{font-size:clamp(38px,4.3vw,65px);line-height:1.08;letter-spacing:-1.5px}h2 em{font-weight:400}::selection{background:#b8975955}.grain{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='white' filter='url(%23n)' opacity='.6' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}.eyebrow{font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:3px;text-transform:uppercase;line-height:1.9}.flourish{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:24px auto}.flourish span{width:64px;height:1px;background:currentColor;opacity:.5}.flourish svg{width:42px;height:22px}.botanical{position:absolute;pointer-events:none}.section-pad{padding:110px max(6vw,24px)}.body-copy{font-family:var(--serif);font-size:22px;line-height:1.55}.muted{color:var(--muted)}.reveal{opacity:0;transform:translateY(28px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.65,.3,1)}.reveal.visible{opacity:1;transform:translateY(0)}

html{overflow-x:clip}
.hero-names{font-family:var(--serif);font-weight:400}
.invitation:not(.closed) .hero-copy>*{animation:invitation-appear 1.4s .55s both cubic-bezier(.2,.65,.3,1)}
.invitation:not(.closed) .hero-copy>.hero-names{animation-delay:.85s}
.invitation:not(.closed) .hero-copy>.hero-line{animation-delay:1.1s}
.invitation:not(.closed) .hero-copy>.hero-date{animation-delay:1.25s}
.invitation:not(.closed) .hero-copy>.hero-venue{animation-delay:1.4s}
.invitation:not(.closed) .hero-copy>.discover{animation-delay:1.55s}
@keyframes invitation-appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.motion-paused .hero-copy>*{animation:none!important}
/* A royal parchment scroll, bound in silk and released with a wax seal. */
.cover{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--gold-light);background:radial-gradient(ellipse at 50% 42%,#613040 0%,#3d1725 49%,#230c14 100%)}
.cover:before{content:'';position:absolute;inset:16px;border:1px solid #c4a16b16;pointer-events:none}
.cover-ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 58%,#bb8b4725,transparent 55%);animation:glow 8s ease-in-out infinite}
.cover-top,.cover-bottom{position:absolute;left:5%;right:5%;display:flex;align-items:center;justify-content:space-between;font-size:8px;letter-spacing:2.7px;color:#c6aa7eab}
.cover-top{top:32px}.cover-bottom{bottom:28px}.cover-bottom>span:nth-child(2){font:italic 20px var(--serif);letter-spacing:2px}
.scroll-stage{--scroll-height:510px;position:relative;width:min(680px,84vw);height:min(650px,calc(100svh - 132px));min-height:490px;perspective:1400px}
.scroll-intro{position:absolute;top:20px;left:0;right:0;text-align:center;transition:opacity .35s ease,transform .65s ease}
.scroll-intro-lotus{width:50px;height:32px;opacity:.7;margin-bottom:14px}
.scroll-intro>.eyebrow{font-size:8px;letter-spacing:3px;color:#d2b586}
.scroll-title{font:400 clamp(43px,4.6vw,66px)/.94 var(--serif);letter-spacing:-1.4px;margin-top:24px;color:#e6c993;text-shadow:0 2px 2px #1e08134a}
.scroll-title>small{font-size:.28em;letter-spacing:2px;white-space:nowrap}.scroll-title>em{display:block;font-size:.48em;line-height:1.25;font-weight:400;margin:6px 0;color:#b58b53}
.scroll-shell{position:absolute;left:0;right:0;top:62%;height:0;filter:drop-shadow(0 28px 30px #17030b70)}
.scroll-paper{position:absolute;top:calc(var(--scroll-height)/-2);height:var(--scroll-height);left:27px;right:27px;overflow:hidden;clip-path:inset(calc(50% - 36px) 0);background:linear-gradient(90deg,#ba985d 0%,#e6d0a3 1.2%,#f5e8c9 5%,#fcf3dc 25%,#f6e8c8 74%,#ddc393 98.8%,#aa8245 100%);box-shadow:inset 0 25px 35px #a67e3c30,inset 0 -25px 35px #a67e3c30;transition:clip-path 1.65s .4s cubic-bezier(.3,.05,.17,1)}
.scroll-paper:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#a3814c05 0px,#a3814c05 1px,transparent 1px,transparent 4px),radial-gradient(ellipse at 12% 17%,#ad814c16,transparent 29%),radial-gradient(ellipse at 82% 78%,#ad814c15,transparent 32%);pointer-events:none}
.scroll-paper:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#73542565,transparent 11%,transparent 89%,#73542565);pointer-events:none;opacity:.8}
.scroll-paper-border{position:absolute;inset:22px 18px;border:1px solid #a3854f80}.scroll-paper-border:before{content:'';position:absolute;inset:5px;border:1px solid #b3986260}.scroll-paper-border:after{content:'✧';position:absolute;left:50%;top:-10px;transform:translateX(-50%);padding:0 9px;background:#f8eccf;color:#9c7a41;font-size:14px}
.scroll-botanical{color:#927342;opacity:.15;bottom:22px;width:31%;height:70%}.scroll-botanical.left{left:-12px;transform:rotate(-9deg)}.scroll-botanical.right{right:-12px;transform:scaleX(-1) rotate(-9deg)}
.scroll-contents{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--wine);padding:45px 25px;opacity:0;transform:translateY(9px);transition:opacity .7s .95s ease,transform 1s .85s ease}
.closed .scroll-contents{visibility:hidden;opacity:0}.opening .scroll-contents{visibility:visible}
.scroll-document-lotus{color:#99743c;width:53px;height:34px;margin-bottom:20px}.scroll-contents>.eyebrow{font-size:7px;letter-spacing:2.2px;color:#8c754b;margin-bottom:25px}
.scroll-names{font:400 clamp(43px,4.5vw,62px)/.93 var(--serif);letter-spacing:-1.4px}.scroll-names>small{font-size:.28em;white-space:nowrap;letter-spacing:2px}.scroll-names>em{font-size:.48em;display:block;line-height:1.3;margin:7px 0;color:#98723c}
.scroll-contents>.flourish{margin:22px auto 15px}.scroll-message{font:italic 22px var(--serif);color:#795c3c}.scroll-document-date{font-size:8px;letter-spacing:2.5px;color:#8b7046;margin-top:23px}
.scroll-roller{position:absolute;left:0;right:0;top:-21px;height:42px;z-index:3;transition:transform 1.65s .4s cubic-bezier(.3,.05,.17,1);transform-style:preserve-3d}
.scroll-roller-top{transform:translateY(-36px)}.scroll-roller-bottom{transform:translateY(36px)}
.roller-spindle{position:absolute;left:-7px;right:-7px;top:10px;height:23px;border-radius:7px;background:linear-gradient(180deg,#6b4023 0%,#d3ab67 12%,#79562d 27%,#4a2818 55%,#27140e 83%,#805932 100%);box-shadow:0 3px 5px #1e0a1270,inset 0 1px 1px #e2c18b77}
.roller-paper{position:absolute;left:26px;right:26px;inset-block:0;border-radius:48% / 15%;background:linear-gradient(180deg,#987340 0%,#c7aa73 5%,#f4e4bd 17%,#fff3d7 29%,#ebd3a4 54%,#b59357 80%,#75522c 96%,#bb9657 100%);box-shadow:0 5px 9px #2e160b55,inset 2px 0 3px #8d693d,inset -2px 0 3px #8d693d;overflow:hidden;transform:translateZ(2px)}
.roller-paper:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0px,transparent 3px,#92714910 4px,transparent 5px);border-inline:1px solid #ad8b51}
.roller-paper:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,#fffae933 26%,transparent 38%);transition:transform 1.65s .4s ease}
.roller-finial{position:absolute;z-index:2;top:7px;width:30px;height:29px;border-radius:48% 48% 48% 48%;background:linear-gradient(180deg,#f4d794 0%,#ab7b3e 17%,#e4c17d 34%,#7d4a23 63%,#b08345 82%,#eccd83 100%);box-shadow:0 4px 6px #210b1380,inset 1px 0 1px #ffedba;outline:1px solid #29180b55}.roller-finial.left{left:-22px}.roller-finial.right{right:-22px}.roller-finial:before{content:'';position:absolute;inset:2px 9px;border-inline:1px solid #60381770;border-radius:40%;box-shadow:1px 0 1px #e5c89188}.roller-finial:after{content:'';position:absolute;width:13px;height:18px;top:5px;background:linear-gradient(#bd9458,#e5c17f 22%,#774724 70%,#bd9458);border-radius:50%}.roller-finial.left:after{left:-8px}.roller-finial.right:after{right:-8px}
.scroll-ribbon{position:absolute;width:42px;height:150px;top:-75px;left:calc(50% - 21px);z-index:4;filter:drop-shadow(1px 3px 3px #34101570);pointer-events:none}.scroll-ribbon>span{position:absolute;left:0;right:0;height:77px;background:linear-gradient(90deg,#31101c,#7a3449 12%,#5e2336 41%,#471627 72%,#8b4255 91%,#34101d);border-inline:1px solid #d0a56c55;transition:transform .85s ease,opacity .65s ease}.ribbon-top{top:0;transform-origin:center bottom;border-top:1px solid #d2ac6e44}.ribbon-bottom{bottom:0;transform-origin:center top;clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%)}
